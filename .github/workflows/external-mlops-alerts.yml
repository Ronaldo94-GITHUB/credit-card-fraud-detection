name: External MLOps Alerts

on:
  workflow_dispatch:

jobs:
  mlops-alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check MLOps alerts
        env:
          PRODUCTION_BASE_URL: https://credit-card-fraud-detection-v5li.onrender.com
          MLOPS_ALERT_PERIOD: 7d
          MLOPS_ALERT_WEBHOOK_ENABLED: ${{ secrets.MLOPS_ALERT_WEBHOOK_ENABLED }}
          MLOPS_ALERT_WEBHOOK_URL: ${{ secrets.MLOPS_ALERT_WEBHOOK_URL }}
          MLOPS_ALERT_WEBHOOK_BEARER_TOKEN: ${{ secrets.MLOPS_ALERT_WEBHOOK_BEARER_TOKEN }}
        run: |
          python scripts/send_mlops_alerts.py
