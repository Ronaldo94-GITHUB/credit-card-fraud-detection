name: Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend-quality:
    name: Backend Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Install CI quality tools
        run: python -m pip install ruff pip-audit

      - name: Compile backend
        run: python -m compileall -q src tests scripts

      - name: Ruff check
        run: python -m ruff check src tests scripts

      - name: Run backend tests
        run: python -m pytest -q

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.txt


  frontend-quality:
    name: Frontend Quality
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend TypeScript and production build
        run: npm run build

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high


  docker-quality:
    name: Docker Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker build configuration
        uses: docker/build-push-action@v6
        with:
          context: .
          call: check
          push: false

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: credit-card-fraud-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max


  security-check:
    name: Repository Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm local admin key is not tracked
        shell: bash
        run: |
          if git ls-files | grep -Fx ".phase14_admin_key.txt"; then
            echo "ERROR: admin key file is tracked by Git."
            exit 1
          fi

          echo "ADMIN_SECRET_NOT_TRACKED=True"

      - name: Detect forbidden secret file names
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env|.*secret.*|.*admin_key.*)$'; then
            echo "Potential secret file tracked."
            exit 1
          fi

          echo "FORBIDDEN_SECRET_FILES_FOUND=False"


  production-gate:
    name: Production Gate
    runs-on: ubuntu-latest

    needs:
      - backend-quality
      - frontend-quality
      - docker-quality
      - security-check

    steps:
      - name: Production quality gate passed
        run: |
          echo "BACKEND_QUALITY=True"
          echo "FRONTEND_QUALITY=True"
          echo "DOCKER_QUALITY=True"
          echo "SECURITY_CHECK=True"
          echo "PRODUCTION_GATE=True"
