name: Security Hardening

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "src/security_hardening.py"
      - "src/security_hardening_api.py"
      - "src/security.py"
      - "src/api.py"
      - "scripts/validate_security_hardening.py"
      - "tests/test_security_hardening.py"
      - "tests/test_security_hardening_api.py"

  pull_request:
    paths:
      - "src/security_hardening.py"
      - "src/security_hardening_api.py"
      - "src/security.py"
      - "src/api.py"
      - "scripts/validate_security_hardening.py"
      - "tests/test_security_hardening.py"
      - "tests/test_security_hardening_api.py"

permissions:
  contents: read

jobs:

  security-hardening:

    name: Security Hardening Validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff
        run: |
          python -m ruff check src tests scripts

      - name: Security tests
        run: |
          python -m pytest -q \
            tests/test_security_hardening.py \
            tests/test_security_hardening_api.py

      - name: Validate hardening
        run: |
          python scripts/validate_security_hardening.py

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-hardening-validation
          path: reports/runtime/security_hardening_validation.json
          if-no-files-found: warn
          retention-days: 30
